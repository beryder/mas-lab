apiVersion: infra/v1
kind: ToolServerRegistry
metadata: {name: records}
spec:
  tool_servers:
    - id: records
      protocol: mcp
      transport: stdio
      command: python
      args: [records.py, records.json]
      tools: [records_read, records_write]
